name: Build Android APK

# APK debug de preview. Compila la web (Vite), la sincroniza al proyecto
# Capacitor y corre gradle assembleDebug en un runner de GitHub.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/travel-agency-pdf-plan-8qcqwn

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/Reservas-Gaby-Tours-2021.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reservas-Gaby-Tours-2021-APK
          path: android/app/build/outputs/apk/debug/Reservas-Gaby-Tours-2021.apk
          if-no-files-found: error
          retention-days: 30
